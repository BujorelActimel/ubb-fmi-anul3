<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookshelf</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #FAF7F2;
      --surface: #F0EBE1;
      --border:  #DDD5C8;
      --text:    #3D3530;
      --muted:   #8A7E76;
      --accent:  #8B6355;
      --want:    #8B6355;
      --reading: #5E7C6A;
      --read:    #4A5D7A;
      --r: 6px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── AUTH ─────────────────────────────────── */
    #auth {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .auth-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 40px;
      width: 360px;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: var(--text);
    }

    .auth-logo p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 4px;
    }

    .tabs {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
    }

    .tab {
      flex: 1;
      padding: 8px 0;
      background: none;
      border: none;
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.15s, border-color 0.15s;
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .field input {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }

    .field input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 11px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 6px;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.88; }
    .btn:disabled { opacity: 0.5; cursor: default; }

    .notice {
      font-size: 13px;
      padding: 10px 12px;
      border-radius: var(--r);
      margin-bottom: 16px;
    }

    .notice.ok  { background: #EBF5EE; color: var(--reading); }
    .notice.err { background: #FBF0ED; color: #A0503C; }

    /* ── APP ──────────────────────────────────── */
    #app { display: none; }

    .topbar {
      display: flex;
      align-items: center;
      padding: 0 24px;
      height: 56px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      gap: 16px;
    }

    .topbar-logo {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.2px;
      flex: 1;
    }

    .topbar-meta {
      font-size: 12px;
      color: var(--muted);
    }

    .btn-ghost {
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 5px 12px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

    .toolbar {
      display: flex;
      align-items: center;
      padding: 16px 24px;
      gap: 8px;
    }

    .filter-btn {
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 13px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .add-btn {
      margin-left: auto;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r);
      padding: 7px 16px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .add-btn:hover { opacity: 0.88; }

    .books {
      padding: 8px 24px 40px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 14px;
    }

    .book-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: box-shadow 0.15s;
    }

    .book-card:hover { box-shadow: 0 2px 12px rgba(0,0,0,0.07); }

    .book-title {
      font-weight: 600;
      font-size: 15px;
      line-height: 1.3;
    }

    .book-author {
      font-size: 13px;
      color: var(--muted);
    }

    .book-meta {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .book-status {
      display: inline-block;
      font-size: 11px;
      font-weight: 500;
      padding: 2px 8px;
      border-radius: 10px;
      letter-spacing: 0.3px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .status-want    { background: #F4EBE7; color: var(--want); }
    .status-reading { background: #E8F2EC; color: var(--reading); }
    .status-read    { background: #E6EBF2; color: var(--read); }

    .stars { font-size: 13px; letter-spacing: 1px; color: #C4967F; }

    .book-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }

    .act-btn {
      flex: 1;
      background: none;
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 5px 0;
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .act-btn:hover { border-color: var(--accent); color: var(--accent); }

    .act-btn.del:hover { border-color: #c0392b; color: #c0392b; }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 0;
      color: var(--muted);
      font-size: 14px;
    }

    /* ── MODAL ────────────────────────────────── */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(61,53,48,0.35);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .overlay.open { display: flex; }

    .modal {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 32px 28px;
      width: 420px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      font-size: 17px;
      font-weight: 600;
      margin-bottom: 20px;
    }

    .modal-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-secondary {
      flex: 1;
      padding: 10px;
      background: none;
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-size: 14px;
      color: var(--muted);
      cursor: pointer;
    }

    .btn-primary {
      flex: 2;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--r);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }

    select {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-size: 14px;
      color: var(--text);
      outline: none;
      appearance: none;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--r);
      font-size: 14px;
      color: var(--text);
      outline: none;
      resize: vertical;
      min-height: 72px;
      font-family: inherit;
    }

    textarea:focus, select:focus { border-color: var(--accent); }
  </style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-card">
    <div class="auth-logo">
      <h1>Bookshelf</h1>
      <p>your personal reading list</p>
    </div>
    <div id="auth-notice" class="notice" style="display:none"></div>
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Sign in</button>
      <button class="tab" onclick="switchTab('register')">Register</button>
    </div>
    <div id="tab-login">
      <div class="field"><label>Email</label><input id="l-email" type="email" placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input id="l-pass" type="password" placeholder="••••••••"></div>
      <button class="btn" onclick="login()">Sign in</button>
    </div>
    <div id="tab-register" style="display:none">
      <div class="field"><label>Email</label><input id="r-email" type="email" placeholder="you@example.com"></div>
      <div class="field"><label>Password</label><input id="r-pass" type="password" placeholder="min 6 characters"></div>
      <button class="btn" onclick="register()">Create account</button>
    </div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <span class="topbar-logo">Bookshelf</span>
    <span class="topbar-meta" id="topbar-info"></span>
    <button class="btn-ghost" onclick="logout()">Sign out</button>
  </div>
  <div class="toolbar">
    <button class="filter-btn active" onclick="setFilter('', this)">All</button>
    <button class="filter-btn" onclick="setFilter('want', this)">Want to read</button>
    <button class="filter-btn" onclick="setFilter('reading', this)">Reading</button>
    <button class="filter-btn" onclick="setFilter('read', this)">Read</button>
    <button class="add-btn" onclick="openModal()">+ Add book</button>
  </div>
  <div class="books" id="books"></div>
</div>

<!-- MODAL -->
<div class="overlay" id="overlay" onclick="closeModalOutside(event)">
  <div class="modal">
    <h2 id="modal-title">Add book</h2>
    <input type="hidden" id="book-id">
    <div class="field"><label>Title *</label><input id="book-title" type="text" placeholder="The Name of the Wind"></div>
    <div class="field"><label>Author</label><input id="book-author" type="text" placeholder="Patrick Rothfuss"></div>
    <div class="modal-row">
      <div class="field"><label>Genre</label><input id="book-genre" type="text" placeholder="Fantasy"></div>
      <div class="field"><label>Year</label><input id="book-year" type="number" placeholder="2007" min="1000" max="2099"></div>
    </div>
    <div class="modal-row">
      <div class="field">
        <label>Status</label>
        <select id="book-status">
          <option value="want">Want to read</option>
          <option value="reading">Reading</option>
          <option value="read">Read</option>
        </select>
      </div>
      <div class="field">
        <label>Rating (1–5)</label>
        <select id="book-rating">
          <option value="">—</option>
          <option value="1">1 — Poor</option>
          <option value="2">2 — Fair</option>
          <option value="3">3 — Good</option>
          <option value="4">4 — Great</option>
          <option value="5">5 — Excellent</option>
        </select>
      </div>
    </div>
    <div class="field"><label>Notes</label><textarea id="book-notes" placeholder="Thoughts, quotes..."></textarea></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="saveBook()">Save</button>
    </div>
  </div>
</div>

<script src="/app.js"></script>
</body>
</html>
