events { worker_connections 1024; }

http {
    include      mime.types;
    default_type application/octet-stream;
    sendfile     on;

    access_log /var/log/nginx/requests.log combined;
    error_log  /var/log/nginx/error.log warn;

    # ── upstream: 2 webapp replicas ───────────────────────────────
    upstream webapp {
        server webapp1:8080;
        server webapp2:8080;
    }

    # ── access list: admin resources only from Docker network ─────
    geo $admin_allowed {
        default          0;
        127.0.0.1        1;
        172.16.0.0/12    1;   # Docker bridge networks
        192.168.0.0/16   1;
        10.0.0.0/8       1;
    }

    # ── HTTP on 8080 ──────────────────────────────────────────────
    server {
        listen 8080;
        server_name nsa.test;

        # Redirect to HTTPS
        return 301 https://$host:8443$request_uri;
    }

    # ── HTTPS on 8443 ─────────────────────────────────────────────
    server {
        listen 8443 ssl;
        server_name nsa.test;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # ── web app ───────────────────────────────────────────────
        location / {
            proxy_pass         http://webapp;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── phpMyAdmin — restricted by ACL ───────────────────────
        location /phpmyadmin/ {
            if ($admin_allowed = 0) { return 403; }
            proxy_pass       http://phpmyadmin:80/;
            proxy_set_header Host $host;
        }

        # ── GoAccess log report (static HTML + WS on :7890) ──────────
        location /logs {
            alias /var/www/logs;
            index report.html;
            try_files /report.html =404;
        }

        # ── GoAccess WebSocket proxy ───────────────────────────────
        location /ws {
            proxy_pass         http://goaccess:7890;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "Upgrade";
            proxy_set_header   Host       $host;
        }
    }
}
