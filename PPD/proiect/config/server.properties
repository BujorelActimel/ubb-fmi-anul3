# Server settings
server.port=8080
server.thread.pool.size=10
server.runtime.minutes=3

# Verification interval (seconds)
verification.interval.seconds=5

# Payment timeout (seconds)
payment.timeout.seconds=10

# Locations and treatments
locations.count=5
treatments.count=5

# Treatment costs (comma-separated)
treatments.costs=50,20,40,100,30

# Treatment durations in minutes (comma-separated)
treatments.durations=120,20,30,60,30

# Max capacity for location 1: N(1,j) for j=1..5
treatments.base.capacity=3,1,1,2,1

# Operating hours
operating.hours.start=10
operating.hours.end=18
